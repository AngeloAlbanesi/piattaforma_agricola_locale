<mat-sidenav-container class="shell" [class.landing-fullscreen]="isLandingPage()">
    <!-- Sidenav nascosto sulla landing page -->
    <mat-sidenav *ngIf="!isLandingPage()" mode="side" opened>
        <div class="shell__brand">
            <h1>{{ appName() }}</h1>
        </div>
        <nav>
            <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
            </a>
        </nav>
    </mat-sidenav>

    <mat-sidenav-content>
        <!-- Toolbar nascosta sulla landing page -->
        <mat-toolbar *ngIf="!isLandingPage()" color="primary" class="shell__toolbar">
            <button mat-icon-button class="shell__menu" aria-label="toggle navigation" disabled>
                <mat-icon>menu</mat-icon>
            </button>
            <span class="shell__toolbar-title">{{ appName() }}</span>
            <span class="shell__spacer"></span>
            <a mat-button routerLink="/auth">Accedi</a>
        </mat-toolbar>

        <!-- Main content con stile condizionale per landing page -->
        <main class="shell__content" [class.landing-fullscreen-content]="isLandingPage()">
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>

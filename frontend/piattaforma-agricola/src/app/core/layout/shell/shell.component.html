<mat-sidenav-container class="shell">
    <mat-sidenav mode="side" opened>
        <div class="shell__brand">
            <h1>{{ appName() }}</h1>
        </div>
        <nav>
            <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
            </a>
        </nav>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar color="primary" class="shell__toolbar">
            <button mat-icon-button class="shell__menu" aria-label="toggle navigation" disabled>
                <mat-icon>menu</mat-icon>
            </button>
            <span class="shell__toolbar-title">{{ appName() }}</span>
            <span class="shell__spacer"></span>
            <a mat-button routerLink="/auth">Accedi</a>
        </mat-toolbar>

        <main class="shell__content">
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>

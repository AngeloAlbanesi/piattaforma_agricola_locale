<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <mat-icon class="auth-icon">agriculture</mat-icon>
            <h1>Accedi alla Piattaforma</h1>
            <p class="auth-subtitle">Connettiti con la filiera agricola locale</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <!-- Campo Email -->
            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" placeholder="Inserisci la tua email"
                    [errorStateMatcher]="errorStateMatcher">
                <mat-icon matSuffix>email</mat-icon>
                <mat-error>{{ getErrorMessage('email') }}</mat-error>
            </mat-form-field>

            <!-- Campo Password -->
            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="Inserisci la tua password" [errorStateMatcher]="errorStateMatcher">
                <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()"
                    [attr.aria-label]="'Mostra password'" aria-pressed="false">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error>{{ getErrorMessage('password') }}</mat-error>
            </mat-form-field>

            <!-- Pulsanti Azione -->
            <div class="form-actions">
                <button mat-raised-button type="submit" color="primary" class="login-btn"
                    [disabled]="loginForm.invalid || isLoading">
                    <span *ngIf="!isLoading">Accedi</span>
                    <span *ngIf="isLoading">
                        <mat-spinner class="spinner" diameter="20"></mat-spinner>
                    </span>
                </button>

                <button mat-stroked-button type="button" class="register-btn" (click)="goToRegistration()">
                    Crea un Account
                </button>
            </div>

            <!-- Link per recupero password -->
            <div class="form-footer">
                <a href="#" class="forgot-password">Hai dimenticato la password?</a>
            </div>
        </form>

        <!-- Benefici del login -->
        <div class="auth-benefits">
            <div class="benefit-item">
                <mat-icon class="benefit-icon">verified_user</mat-icon>
                <span>Accesso sicuro con JWT</span>
            </div>
            <div class="benefit-item">
                <mat-icon class="benefit-icon">dashboard</mat-icon>
                <span>Dashboard personalizzato</span>
            </div>
            <div class="benefit-item">
                <mat-icon class="benefit-icon">storefront</mat-icon>
                <span>Mercato completo</span>
            </div>
        </div>
    </div>

    <!-- Roles removed: role selection happens only at registration -->
</div>

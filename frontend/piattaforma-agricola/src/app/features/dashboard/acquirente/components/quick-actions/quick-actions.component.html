<div class="quick-actions">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Azioni Rapide</mat-card-title>
      <mat-card-subtitle>Esegui rapidamente le operazioni principali</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="actions-grid">
        <div
          *ngFor="let action of quickActions; trackBy: trackByAction"
          class="action-item"
          [ngClass]="action.color"
          (click)="onActionClick(action.id)"
          [matTooltip]="action.description"
          matTooltipPosition="above">
          
          <div class="action-icon">
            <mat-icon>{{ action.icon }}</mat-icon>
          </div>
          
          <div class="action-content">
            <h4 class="action-title">{{ action.label }}</h4>
            <p class="action-description">{{ action.description }}</p>
          </div>
          
          <div class="action-arrow">
            <mat-icon>arrow_forward</mat-icon>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

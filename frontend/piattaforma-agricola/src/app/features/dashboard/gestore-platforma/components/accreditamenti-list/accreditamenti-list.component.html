<mat-card>
    <mat-card-title>Richieste in attesa - {{ tipo }}</mat-card-title>
    <div class="loading" *ngIf="isLoading">
        <mat-progress-spinner diameter="36" mode="indeterminate"></mat-progress-spinner>
    </div>
    <div *ngIf="!isLoading && data.length === 0" class="empty">
        Nessuna richiesta in attesa.
    </div>
    <div *ngIf="!isLoading && data.length > 0">
        <table mat-table [dataSource]="data" class="mat-elevation-z2">
            <ng-container matColumnDef="idUtente">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let u">{{ u.idUtente }}</td>
            </ng-container>
            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef>Nome</th>
                <td mat-cell *matCellDef="let u">{{ u.nome }}</td>
            </ng-container>
            <ng-container matColumnDef="cognome">
                <th mat-header-cell *matHeaderCellDef>Cognome</th>
                <td mat-cell *matCellDef="let u">{{ u.cognome }}</td>
            </ng-container>
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let u">{{ u.email }}</td>
            </ng-container>
            <ng-container matColumnDef="ruolo">
                <th mat-header-cell *matHeaderCellDef>Ruolo</th>
                <td mat-cell *matCellDef="let u">{{ u.ruolo }}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Azioni</th>
                <td mat-cell *matCellDef="let u">
                    <button mat-stroked-button color="primary"
                        (click)="changeState(u, Stato.APPROVATO)">Approva</button>
                    <button mat-stroked-button color="warn" (click)="changeState(u, Stato.RIFIUTATO)">Rifiuta</button>
                    <button mat-stroked-button (click)="changeState(u, Stato.SOSPESO)">Sospendi</button>
                    <button *ngIf="tipo==='venditori'" mat-icon-button matTooltip="Dettagli azienda"
                        (click)="viewCompany(u)">
                        <mat-icon>business</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </div>
</mat-card>
